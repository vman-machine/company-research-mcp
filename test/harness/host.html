<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MCP Apps test host</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font: 14px system-ui, sans-serif; background: light-dark(#faf9f5, #141413); color: light-dark(#141413, #faf9f5); }
      main { max-width: 820px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; }
      .bubble { align-self: flex-end; background: light-dark(#e8e6dc, #3a3936); padding: 10px 14px; border-radius: 14px; max-width: 70%; }
      iframe { width: 100%; border: 0; height: 120px; display: block; transition: height 0.3s ease; background: transparent; }
      body.fullscreen main { max-width: none; padding: 0; }
      body.fullscreen iframe { height: 100vh !important; }
      body.fullscreen .bubble, body.fullscreen .panels { display: none; }
      .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
      .panel { border: 1px solid light-dark(#ddd, #444); border-radius: 8px; padding: 8px; font-size: 12px; }
      .panel h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: light-dark(#777, #999); }
      pre { white-space: pre-wrap; margin: 0; max-height: 160px; overflow: auto; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="bubble" id="prompt">…</div>
      <iframe id="app" title="MCP App"></iframe>
      <div class="panels">
        <div class="panel"><h4>Status</h4><pre id="status">starting</pre></div>
        <div class="panel"><h4>Messages from app</h4><pre id="messages"></pre></div>
        <div class="panel"><h4>Model context</h4><pre id="context"></pre></div>
        <div class="panel"><h4>Links / result</h4><pre id="links"></pre><pre id="result"></pre></div>
      </div>
    </main>
    <script type="module" src="/test/harness/host.ts"></script>
  </body>
</html>
